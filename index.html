<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #0B0F14;
    --panel: #101720;
    --panel-2: #0D131B;
    --border: #1E2A38;
    --border-soft: #182230;
    --text: #E9EFF5;
    --text-dim: #8FA3B8;
    --text-faint: #5C7086;
    --teal: #2DD4BF;
    --teal-dim: rgba(45,212,191,0.12);
    --amber: #FFB020;
    --amber-dim: rgba(255,176,32,0.12);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Manrope', system-ui, sans-serif;
    --radius: 3px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 28px 28px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{ max-width: 860px; margin:0 auto; padding: 0 24px; position:relative; z-index:1; }

  /* ---------- Top bar / router ---------- */
  .topbar{
    border-bottom:1px solid var(--border);
    background: linear-gradient(180deg, rgba(16,23,32,0.9), rgba(16,23,32,0.7));
    backdrop-filter: blur(6px);
    position: sticky; top:0; z-index: 10;
  }
  .topbar-inner{
    max-width:860px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family: var(--mono); font-weight:700; font-size:14px; letter-spacing:0.02em;
    color:var(--text); display:flex; align-items:center; gap:8px;
  }
  .wordmark .dot{ width:7px; height:7px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px var(--teal); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.35;} }

  .status{
    font-family: var(--mono); font-size:12px; color:var(--text-dim);
    display:flex; align-items:center; gap:10px;
  }
  .status .code{ color: var(--teal); font-weight:600; }
  .status .ms{ color: var(--amber); font-variant-numeric: tabular-nums; min-width:38px; display:inline-block; text-align:right; }

  .route-line{
    font-family: var(--mono); font-size:13px; color: var(--text-dim);
    padding: 10px 24px 0 24px; max-width:860px; margin:0 auto;
  }
  .route-line .verb{ color: var(--teal); font-weight:700; }
  .route-line .path{ color: var(--text); }
  .route-line .role{ color: var(--amber); }

  .role-picker-wrap{
    max-width:860px; margin:0 auto; padding: 10px 24px 16px 24px;
    display:flex; align-items:center; gap:9px;
  }
  .role-picker-wrap.hidden{ display:none; }
  .role-label{
    font-family: var(--mono); font-size:11px; color: var(--text-faint);
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .role-select{
    font-family: var(--mono); font-size:12px; color: var(--teal);
    background: var(--panel-2); border:1px solid var(--border); border-radius: var(--radius);
    padding:6px 10px; cursor:pointer; appearance:none; -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-faint) 50%), linear-gradient(135deg, var(--text-faint) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:28px;
  }
  .role-select:focus{ outline:1px solid var(--teal); }
  .role-select option{ background: var(--panel); color: var(--text); }

  /* ---------- Hero ---------- */
  .hero{ padding: 40px 0 28px 0; border-bottom:1px solid var(--border-soft); }
  .name{
    font-family: var(--mono); font-weight:700;
    font-size: clamp(32px, 6vw, 46px);
    letter-spacing:-0.01em;
    color: var(--text);
  }
  .tagline{
    margin-top:12px; font-family: var(--sans); font-size:16px; font-weight:600;
    color: var(--text); max-width: 56ch; line-height:1.5;
  }
  .headline{
    margin-top:10px; font-family: var(--mono); font-size:13px;
    color: var(--teal); letter-spacing:0.03em; text-transform:uppercase;
    line-height:1.7;
  }
  .contact-row{
    margin-top:18px; display:flex; flex-wrap:wrap; gap:10px 18px;
    font-family: var(--mono); font-size:12.5px; color: var(--text-dim);
  }
  .contact-row a{ color:var(--text-dim); text-decoration:none; border-bottom:1px dashed var(--border); }
  .contact-row a:hover{ color:var(--teal); border-color:var(--teal); }
  .contact-row span.sep{ color: var(--text-faint); }

  .hero-actions{ margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family: var(--mono); font-size:12px; padding:9px 14px; border-radius: var(--radius);
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition: all .15s ease;
  }
  .btn:hover{ border-color: var(--teal); color: var(--teal); }
  .btn.primary{ background: var(--teal-dim); border-color: rgba(45,212,191,0.45); color: var(--teal); }
  .btn.primary:hover{ background: rgba(45,212,191,0.2); }
  .btn .copied{ color: var(--amber); }

  /* ---------- Sections ---------- */
  section{ padding: 34px 0; border-bottom:1px solid var(--border-soft); }
  section:last-of-type{ border-bottom:none; }
  .sec-head{
    display:flex; align-items:baseline; gap:12px; margin-bottom:18px;
  }
  .sec-tag{
    font-family: var(--mono); font-size:11px; color: var(--text-faint);
    border:1px solid var(--border); padding:2px 7px; border-radius: var(--radius);
    letter-spacing:0.08em;
  }
  .sec-title{
    font-family: var(--mono); font-size:14px; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase; color: var(--text);
  }
  .sec-line{ flex:1; height:1px; background: var(--border-soft); }

  .summary-text{ color: var(--text-dim); font-size:15px; max-width: 70ch; }

  /* Skills */
  .skill-group{ margin-bottom:16px; }
  .skill-group:last-child{ margin-bottom:0; }
  .skill-group-label{
    font-family: var(--mono); font-size:11.5px; color: var(--amber);
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px;
  }
  .tag-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .tag{
    font-family: var(--mono); font-size:12px; color: var(--text-dim);
    background: var(--panel); border:1px solid var(--border-soft);
    padding:5px 9px; border-radius: var(--radius);
  }

  /* Experience */
  .job{ display:grid; grid-template-columns: 96px 1fr; gap:20px; margin-bottom:26px; }
  .job:last-child{ margin-bottom:0; }
  .job-time{ font-family: var(--mono); font-size:11.5px; color: var(--text-faint); padding-top:3px; }
  .job-time .bar{ display:block; width:1px; height:calc(100% - 16px); background:var(--border); margin: 8px 0 0 3px; }
  .job-header{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin-bottom:4px; }
  .job-role{ font-weight:700; font-size:15.5px; color: var(--text); }
  .job-company{ font-family: var(--mono); font-size:12.5px; color: var(--teal); }
  .cluster{ margin-top:14px; }
  .cluster-title{
    font-family: var(--mono); font-size:11.5px; color: var(--text-faint);
    text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;
  }
  .cluster ul{ list-style:none; }
  .cluster li{
    position:relative; padding-left:16px; margin-bottom:7px;
    color: var(--text-dim); font-size:14px;
  }
  .cluster li::before{
    content:"›"; position:absolute; left:0; color: var(--teal); font-family:var(--mono);
  }
  .cluster li:last-child{ margin-bottom:0; }

  /* two column */
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:36px; }
  @media (max-width:640px){ .two-col{ grid-template-columns:1fr; gap:28px; } }
  .list-item{ margin-bottom:14px; }
  .list-item:last-child{ margin-bottom:0; }
  .list-item-title{ font-weight:700; font-size:14px; color:var(--text); }
  .list-item-sub{ font-family: var(--mono); font-size:11.5px; color: var(--text-faint); margin-top:2px; }
  .list-item-meta{ font-size:12.5px; color: var(--text-dim); margin-top:2px; }

  /* Projects */
  .proj-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap:14px; }
  .proj-card{
    background: var(--panel); border:1px solid var(--border-soft); border-radius: var(--radius);
    padding:16px;
  }
  .proj-title{ font-weight:700; font-size:14px; color:var(--text); margin-bottom:4px; }
  .proj-tag{ font-family: var(--mono); font-size:10.5px; color: var(--amber); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; display:block; }
  .proj-desc{ font-size:13px; color: var(--text-dim); }

  /* Achievements */
  .ach-item{ display:flex; gap:12px; margin-bottom:12px; align-items:flex-start; }
  .ach-item:last-child{ margin-bottom:0; }
  .ach-badge{
    font-family: var(--mono); font-size:10px; color: var(--amber);
    border:1px solid rgba(255,176,32,0.35); background: var(--amber-dim);
    padding:3px 6px; border-radius: var(--radius); white-space:nowrap; margin-top:2px;
  }
  .ach-text .ach-title{ font-weight:700; font-size:13.5px; color:var(--text); }
  .ach-text .ach-desc{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }

  /* Hobbies */
  .hobby-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
  .hobby-card{
    background: var(--panel); border:1px solid var(--border-soft); border-radius: var(--radius);
    padding:14px; display:flex; flex-direction:column; gap:4px;
  }
  .hobby-emoji{ font-size:20px; line-height:1; }
  .hobby-name{ font-weight:700; font-size:13.5px; color: var(--text); }
  .hobby-note{ font-size:12px; color: var(--text-dim); }
  .hobby-edit-hint{
    font-family: var(--mono); font-size:11.5px; color: var(--text-faint);
    border:1px dashed var(--border); border-radius: var(--radius); padding:10px 12px;
  }

  /* Footer */
  footer{ padding: 34px 0 60px 0; }
  .foot-grid{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px; }
  .foot-note{ font-family: var(--mono); font-size:11.5px; color: var(--text-faint); }
  .lang-row{ display:flex; gap:8px; flex-wrap:wrap; }

  /* fade transition */
  .fade{ animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .fade{ animation:none; }
    .wordmark .dot{ animation:none; }
  }

  /* Print */
  @media print{
    body::before{ display:none; }
    .topbar, .route-line, .tabs, .hero-actions{ display:none !important; }
    body{ background:#fff; color:#111; }
    .wrap{ max-width:100%; }
    section{ border-color:#ddd; padding:16px 0; }
    .name, .job-role, .list-item-title, .proj-title, .ach-title{ color:#111; }
    .headline{ color:#333; }
    .summary-text, .cluster li, .proj-desc, .list-item-meta, .ach-desc{ color:#333; }
    .tag{ border-color:#ccc; color:#333; background:#f5f5f5; }
    .cluster li::before{ color:#333; }
  }
</style>
</head>
